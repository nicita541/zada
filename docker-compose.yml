services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zada
      POSTGRES_USER: zada
      POSTGRES_PASSWORD: zada
    ports:
      - "5432:5432"
    volumes:
      - zada-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zada -d zada"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://zada:zada@postgres:5432/zada?schema=public
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zada-postgres:
